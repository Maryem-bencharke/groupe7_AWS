<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="auth.css">
    <script src="https://groupe7-aws.onrender.com/socket.io/socket.io.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>

    </head>
<body>
    <div class="container">
        <h1>Créer un compte</h1>
        <form id="signup-form">
            <input type="text" id="username" placeholder="Nom d'utilisateur" required>
            <input type="email" id="email" placeholder="Email" required>
            <div class="password-container">
                <input type="password" id="password" placeholder="Mot de passe" required>
                <button type="button" class="toggle-password">👁️</button>
            </div>
            <div class="password-requirements">
                <p>Votre mot de passe doit contenir :</p>
                <ul>
                    <li id="req-length">Au moins 8 caractères</li>
                    <li id="req-lower">Une lettre minuscule</li>
                    <li id="req-upper">Une lettre majuscule</li>
                    <li id="req-number">Un chiffre</li>
                    <li id="req-special">Un caractère spécial</li>
                </ul>
            </div>
            <button type="submit">S'inscrire</button>
        </form>
        <p>Déjà un compte ? <a href="login.html">Se connecter</a></p>
    </div>
</body>
</html>
